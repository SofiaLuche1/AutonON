<!DOCTYPE html>
<html
lang="pt-br"
>
<head>
<meta
charset="UTF-8"
>
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<script>
tailwind.config = {
theme: {
extend: {
colors: {

'dark-sky-blue': '#97B4DE',
'custom-blue': '#263A99',

'pastel-gray': '#DCD0BE',
}
}
}
}
</script>

<title>AutonON | Criar página</title>

<link
href="./dist/output.css"
rel="stylesheet"
>
</head>

<body
class="
bg-gray-50
text-gray-800
flex
flex-col
min-h-screen
font-sans"
>

<!-- BARRA DE NAVEGAÇÃO -->
<header
class="
flex
items-center
gap-4
py-4
px-[8%]
bg-white
border-b
border-gray-200
text-sm"
>
<a
href="#"
id="link-lar"
class="
text-blue-700
hover:underline"
>
Lar
</a>

<span
class="
text-gray-300"
>
|
</span>

<a
href="#"
id="link-usuario"
class="
text-blue-700
hover:underline"
>
Akira Sato
</a>

<span
class="
text-gray-300"
>
|
</span>

<a
href="#"
id="link-criar"
class="
text-blue-700
hover:underline"
>
Criar
</a>
</header>

<!-- ALERTA -->
<div
id="alerta"
role="alert"
class="
hidden
fixed
top-5
right-5
z-50
max-w-sm
rounded-lg
border
px-4
py-3
shadow-lg
text-sm"
>
<div
class="
flex
items-start
gap-3"
>
<span
id="alerta-icone"
class="
font-bold"
>
✓
</span>

<div>
<strong
id="alerta-titulo"
class="
block
font-semibold"
>
Sucesso
</strong>

<span
id="alerta-mensagem"
>
Operação realizada.
</span>
</div>

<button
id="fechar-alerta"
type="button"
class="
ml-3
text-lg
leading-none
opacity-70
hover:opacity-100"
aria-label="Fechar alerta"
>
×
</button>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<main
class="
flex-1
w-full
max-w-6xl
mx-auto
px-4
sm:px-8
lg:px-10
py-6"
>

<!-- ABAS -->
<nav
class="
flex
flex-wrap
items-center
gap-2
mb-4"
aria-label="Etapas da criação"
>
<button
 type="button"
 data-tab="identidade"
 class="tab-button rounded-md bg-indigo-600 px-4 py-2 text-sm text-white shadow-sm transition-colors hover:bg-indigo-700"
>
Identidade
</button>

<button
 type="button"
 data-tab="apresentacao"
 class="tab-button rounded-md px-4 py-2 text-sm text-gray-500 transition-colors hover:bg-gray-200 hover:text-gray-800"
>
Apresentação
</button>

<button
 type="button"
 data-tab="servicos"
 class="tab-button rounded-md px-4 py-2 text-sm text-gray-500 transition-colors hover:bg-gray-200 hover:text-gray-800"
>
Serviços
</button>

<button
 type="button"
 data-tab="galeria"
 class="tab-button rounded-md px-4 py-2 text-sm text-gray-500 transition-colors hover:bg-gray-200 hover:text-gray-800"
>
Galeria
</button>

<button
 type="button"
 data-tab="tema"
 class="tab-button rounded-md px-4 py-2 text-sm text-gray-500 transition-colors hover:bg-gray-200 hover:text-gray-800"
>
Tema
</button>
</nav>

<form
id="formulario-dashboard"
class="
space-y-5"
>

<!-- ABA IDENTIDADE -->
<section
id="tab-identidade"
class="tab-content"
>
<h1
class="
text-sm
font-medium
text-gray-800"
>
Identidade
</h1>

<div
class="
mt-1
space-y-3"
>
<div>
<label
for="nome-marca"
class="
block
text-xs
text-gray-700
mb-1"
>
Nome da Marca
</label>

<input
id="nome-marca"
name="nome-marca"
type="text"
class="
w-full
h-8
rounded-md
border
border-gray-300
bg-white
px-3
text-sm
outline-none
focus:border-indigo-500
focus:ring-1
focus:ring-indigo-500"
>
</div>

<div>
<label
for="slogan"
class="
block
text-xs
text-gray-700
mb-1"
>
Slogan
</label>

<input
id="slogan"
name="slogan"
type="text"
class="
w-full
h-8
rounded-md
border
border-gray-300
bg-white
px-3
text-sm
outline-none
focus:border-indigo-500
focus:ring-1
focus:ring-indigo-500"
>
</div>

<div>
<label
for="foto"
class="
block
text-xs
text-gray-700
mb-1"
>
Foto
</label>

<div
class="
flex
items-center
flex-wrap
gap-3"
>
<input
id="foto"
name="foto"
type="file"
accept="image/*"
class="
block
w-full
max-w-md
text-sm
text-gray-500
file:mr-3
file:rounded-md
file:border-0
file:bg-gray-100
file:px-3
file:py-2
file:text-sm
file:text-gray-700
hover:file:bg-gray-200"
>

<img
id="preview-foto"
alt="Pré-visualização da foto"
class="
hidden
h-12
w-12
rounded-full
object-cover
border
border-gray-200"
>
</div>
</div>
</div>
</section>

<!-- ABA APRESENTAÇÃO -->
<section
id="tab-apresentacao"
class="tab-content hidden"
>
<h1
class="
text-sm
font-medium
text-gray-800"
>
Apresentação
</h1>

<label
for="descricao"
class="
block
text-xs
text-gray-700
mt-1
mb-1"
>
Descrição
</label>

<textarea
id="descricao"
name="descricao"
rows="6"
placeholder="Conte um pouco sobre sua marca..."
class="
w-full
rounded-md
border
border-gray-300
bg-white
px-3
py-2
text-sm
outline-none
focus:border-indigo-500
focus:ring-1
focus:ring-indigo-500"
></textarea>
</section>

<!-- ABA SERVIÇOS -->
<section
id="tab-servicos"
class="tab-content hidden"
>
<h1
class="
text-sm
font-medium
text-gray-800"
>
Serviços
</h1>

<label
for="servicos"
class="
block
text-xs
text-gray-700
mt-1
mb-1"
>
Serviços oferecidos
</label>

<textarea
id="servicos"
name="servicos"
rows="6"
placeholder="Digite os serviços oferecidos, um por linha..."
class="
w-full
rounded-md
border
border-gray-300
bg-white
px-3
py-2
text-sm
outline-none
focus:border-indigo-500
focus:ring-1
focus:ring-indigo-500"
></textarea>
</section>

<!-- ABA GALERIA -->
<section
id="tab-galeria"
class="tab-content hidden"
>
<h1
class="
text-sm
font-medium
text-gray-800"
>
Galeria
</h1>

<label
for="imagens"
class="
block
text-xs
text-gray-700
mt-1
mb-1"
>
Adicionar imagens
</label>

<input
id="imagens"
name="imagens"
type="file"
accept="image/*"
multiple
class="
block
w-full
max-w-md
text-sm
text-gray-500
file:mr-3
file:rounded-md
file:border-0
file:bg-gray-100
file:px-3
file:py-2
file:text-sm
file:text-gray-700
hover:file:bg-gray-200"
>

<div
id="lista-galeria"
class="
mt-4
flex
flex-wrap
gap-3"
></div>
</section>

<!-- ABA TEMA -->
<section
id="tab-tema"
class="tab-content hidden"
>
<h1
class="
text-sm
font-medium
text-gray-800"
>
Tema
</h1>

<div
class="
mt-3
grid
grid-cols-1
sm:grid-cols-2
gap-4"
>
<div>
<label
for="cor-principal"
class="
block
text-xs
text-gray-700
mb-1"
>
Cor principal

<input
id="cor-principal"
name="cor-principal"
type="color"
value="#4f46e5"
class="
h-10
w-full
cursor-pointer
rounded-md
border
border-gray-300
bg-white
p-1"
>
</div>

<div>
<label
for="estilo-fonte"
class="
block
text-xs
text-gray-700
mb-1"
>
Estilo da fonte
</label>

<select
id="estilo-fonte"
name="estilo-fonte"
class="
h-10
w-full
rounded-md
border
border-gray-300
bg-white
px-3
text-sm
outline-none
focus:border-indigo-500"
>
<option value="sans">Sans-serif</option>
<option value="serif">Serifada</option>
<option value="mono">Monoespaçada</option>
</select>
</div>
</div>
</section>

<!-- CONTROLES -->
<div
class="
flex
items-center
gap-3
pt-1"
>
<button
id="botao-voltar"
type="button"
class="
hidden
rounded-md
bg-gray-200
px-4
py-2
text-sm
font-medium
text-gray-700
transition-colors
hover:bg-gray-300"
>
Voltar
</button>

<button
id="botao-continuar"
type="button"
class="
rounded-md
bg-indigo-600
px-4
py-2
text-sm
font-medium
text-white
shadow-sm
transition-colors
hover:bg-indigo-700
focus:outline-none
focus:ring-2
focus:ring-indigo-400
focus:ring-offset-2"
>
Continuar
</button>

<button
id="botao-enviar"
type="submit"
class="
hidden
rounded-md
bg-green-600
px-4
py-2
text-sm
font-medium
text-white
shadow-sm
transition-colors
hover:bg-green-700
focus:outline-none
focus:ring-2
focus:ring-green-400
focus:ring-offset-2"
>
Enviar
</button>
</div>
</form>
</main>

<script>
const abas = [
  'identidade',
  'apresentacao',
  'servicos',
  'galeria',
  'tema'
];

let abaAtual = 0;

const alerta = document.getElementById('alerta');
const alertaTitulo = document.getElementById('alerta-titulo');
const alertaMensagem = document.getElementById('alerta-mensagem');
const alertaIcone = document.getElementById('alerta-icone');
const botaoVoltar = document.getElementById('botao-voltar');
const botaoContinuar = document.getElementById('botao-continuar');
const botaoEnviar = document.getElementById('botao-enviar');
const formulario = document.getElementById('formulario-dashboard');

function mostrarAlerta(mensagem, tipo = 'sucesso') {
  const sucesso = tipo === 'sucesso';

  alerta.classList.remove('hidden', 'border-green-200', 'bg-green-50', 'text-green-800', 'border-red-200', 'bg-red-50', 'text-red-800');

  if (sucesso) {
    alerta.classList.add('border-green-200', 'bg-green-50', 'text-green-800');
    alertaTitulo.textContent = 'Sucesso';
    alertaIcone.textContent = '✓';
  } else {
    alerta.classList.add('border-red-200', 'bg-red-50', 'text-red-800');
    alertaTitulo.textContent = 'Atenção';
    alertaIcone.textContent = '!';
  }

  alertaMensagem.textContent = mensagem;

  window.clearTimeout(window.timerAlerta);
  window.timerAlerta = window.setTimeout(() => {
    alerta.classList.add('hidden');
  }, 4000);
}

function atualizarAba(indice) {
  abaAtual = indice;

  document.querySelectorAll('.tab-content').forEach((conteudo) => {
    conteudo.classList.add('hidden');
  });

  document.getElementById(`tab-${abas[indice]}`).classList.remove('hidden');

  document.querySelectorAll('.tab-button').forEach((botao) => {
    const ativo = botao.dataset.tab === abas[indice];

    botao.classList.toggle('bg-indigo-600', ativo);
    botao.classList.toggle('text-white', ativo);
    botao.classList.toggle('shadow-sm', ativo);
    botao.classList.toggle('text-gray-500', !ativo);
    botao.classList.toggle('hover:bg-gray-200', !ativo);
    botao.classList.toggle('hover:text-gray-800', !ativo);
  });

  botaoVoltar.classList.toggle('hidden', indice === 0);
  botaoContinuar.classList.toggle('hidden', indice === abas.length - 1);
  botaoEnviar.classList.toggle('hidden', indice !== abas.length - 1);
}

document.querySelectorAll('.tab-button').forEach((botao) => {
  botao.addEventListener('click', () => {
    atualizarAba(abas.indexOf(botao.dataset.tab));
  });
});

botaoContinuar.addEventListener('click', () => {
  if (abaAtual < abas.length - 1) {
    atualizarAba(abaAtual + 1);
    mostrarAlerta(`Etapa ${abaAtual + 1} de ${abas.length} aberta.`);
  }
});

botaoVoltar.addEventListener('click', () => {
  if (abaAtual > 0) {
    atualizarAba(abaAtual - 1);
  }
});

formulario.addEventListener('submit', (evento) => {
  evento.preventDefault();

  const nomeMarca = document.getElementById('nome-marca').value.trim();

  if (!nomeMarca) {
    atualizarAba(0);
    mostrarAlerta('Preencha o Nome da Marca antes de enviar.', 'erro');
    document.getElementById('nome-marca').focus();
    return;
  }

  mostrarAlerta('As informações da sua página foram enviadas com sucesso.');
});

document.getElementById('fechar-alerta').addEventListener('click', () => {
  alerta.classList.add('hidden');
});

document.getElementById('foto').addEventListener('change', (evento) => {
  const arquivo = evento.target.files[0];
  const preview = document.getElementById('preview-foto');

  if (!arquivo) {
    preview.classList.add('hidden');
    preview.removeAttribute('src');
    return;
  }

  preview.src = URL.createObjectURL(arquivo);
  preview.classList.remove('hidden');
});

document.getElementById('imagens').addEventListener('change', (evento) => {
  const lista = document.getElementById('lista-galeria');
  lista.innerHTML = '';

  Array.from(evento.target.files).forEach((arquivo) => {
    const imagem = document.createElement('img');
    imagem.src = URL.createObjectURL(arquivo);
    imagem.alt = arquivo.name;
    imagem.className = 'h-20 w-20 rounded-md border border-gray-200 object-cover';
    lista.appendChild(imagem);
  });
});

atualizarAba(0);
</script>

</body>
</html>
