<!DOCTYPE html>
<html
lang="pt-br"
>
<head>
<meta
charset="UTF-8"
>
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>
<title>Login</title>
<link href="./dist/output.css" rel="stylesheet">
</head>
<body
class="
bg-charleston-green
flex
items-center
justify-center
min-h-screen"
>
<div
class="
relative
py-3
sm:max-w-xs
sm:mx-auto"
>
<div
class="
min-h-96
px-8
py-6
mt-4
text-left
bg-white
dark:bg-gray-900
rounded-xl
shadow-lg"
>
<div
class="
flex
flex-col
justify-center
items-center
h-full
select-none"
>
<div
class="
flex
flex-col
items-center
justify-center
gap-2
mb-8"
>
<div
class="
w-8
h-8
bg-gray-700"
></div>
<p
class="
m-0
text-[16px]
font-semibold
dark:text-white"
>
Faça login na sua conta
</p>
<span
class="
m-0
text-xs
max-w-[90%]
text-center
text-[#8B8E98]"
>
Entre com suas credenciais para acessar sua conta.
</span>
</div>
<div
class="
w-full
flex
flex-col
gap-2"
>
<label
class="
font-semibold
text-xs
text-gray-400"
>Nome de usuário</label>
<input
placeholder="Nome"
class="
border
rounded-lg
px-3
py-2
mb-5
text-sm
w-full
outline-none
dark:border-gray-500
dark:bg-gray-900
text-white
caret-white
focus:border-dark-sky-blue"
/>
</div>
</div>
<div
class="
w-full
flex
flex-col
gap-2"
>
<label
class="
font-semibold
text-xs
text-gray-400"
>Senha</label>
<input
placeholder="Digite aqui"
type="password"
class="
border
rounded-lg
px-3
py-2
mb-5
text-sm
w-full
outline-none
dark:border-gray-500
dark:bg-gray-900
text-white
caret-white
focus:border-dark-sky-blue"
/>
</div>
<div>
<button
class="
py-2
px-8
bg-custom-blue
hover:bg-[#3148b8]
text-white
w-full
transition
duration-200
text-center
text-base
font-semibold
shadow-md
rounded-lg
cursor-pointer
select-none"
>
Entrar
</button>
</div>
</div>
</div>
