<!DOCTYPE html>
<html
lang="pt-br"
>
<head>
<meta
charset="UTF-8"
>
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<!-- CDN TailwindCSS -->
<script
src="https://cdn.tailwindcss.com"
></script>

<!-- Widget Script -->
<script
src="./src/JS/widget.min.js"
></script>

<title>Login</title>
<link
href="./dist/output.css"
rel="stylesheet"
>
</head>
<body
class="
bg-[#F6F7F3]
text-[#212529]
flex
items-center
justify-center
min-h-screen
font-sans
antialiased"
>
<div
class="
relative
py-3
sm:max-w-xs
sm:mx-auto
w-full
px-4
sm:px-0"
>
<div
class="
min-h-96
px-8
py-8
mt-4
text-left
bg-white
border
border-[#E2E4DC]
rounded-2xl
shadow-sm"
>
<div
class="
flex
flex-col
justify-center
items-center
h-full
select-none"
>
<div
class="
flex
flex-col
items-center
justify-center
gap-2
mb-6"
>
<div
class="
w-10
h-10
bg-[#2563eb]
rounded-xl
flex
items-center
justify-center
shadow-sm"
>
<svg
class="
w-6
h-6
fill-white"
viewBox="0 0 24 24"
>
<path
d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"
/>
</svg>
</div>
<p
class="
m-0
text-lg
font-bold
text-[#1e293b]
mt-1"
>
Faça login na sua conta
</p>
<span
class="
m-0
text-xs
max-w-[90%]
text-center
text-slate-500"
>
Entre com suas credenciais para acessar sua conta.
</span>
</div>
<div
class="
w-full
flex
flex-col
gap-1.5"
>
<label
class="
font-semibold
text-xs
text-slate-700"
>Nome de usuário</label>
<input
type="text"
placeholder="Nome"
class="
border
border-[#CBD5E1]
bg-[#F9FAFB]
rounded-lg
px-3
py-2.5
mb-4
text-sm
w-full
outline-none
text-[#212529]
placeholder-slate-400
focus:bg-white
focus:border-[#2563eb]
focus:ring-1
focus:ring-[#2563eb]
transition-all"
/>
</div>
<div
class="
w-full
flex
flex-col
gap-1.5"
>
<label
class="
font-semibold
text-xs
text-slate-700"
>Senha</label>
<input
type="password"
placeholder="Digite aqui"
class="
border
border-[#CBD5E1]
bg-[#F9FAFB]
rounded-lg
px-3
py-2.5
mb-6
text-sm
w-full
outline-none
text-[#212529]
placeholder-slate-400
focus:bg-white
focus:border-[#2563eb]
focus:ring-1
focus:ring-[#2563eb]
transition-all"
/>
</div>
</div>
<div>
<button
class="
py-2.5
px-8
bg-[#2563eb]
hover:bg-[#1d4ed8]
active:scale-[0.98]
text-white
w-full
transition
duration-200
text-center
text-sm
font-semibold
shadow-sm
rounded-lg
cursor-pointer
select-none"
>
Entrar
</button>
</div>
</div>
</div>
</body>
</html>
